[project]
name = "apps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angga", email = "Anggalabola44@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pycryptodome>=4.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "vercel-blob>=0.5.1",
]

[project.scripts]
apps = "apps:main"

[tool.vercel]
entrypoint = "app:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
