<!DOCTYPE html><html lang="en"><head><meta property="og:image" content="https://angga-labola.github.io/photos/og.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="/static/styles.css"><title>Bible</title></head><body><img src="/static/photos/cross_vector.jpg" alt="Cross" height="250" width="150" class="center-block"><br><br><h2 data-number="134" data-sid="PSA 134" class="c">134</h2><p class="d">A Song of degrees.</p><p class="q1"><span data-number="1" data-sid="PSA 134:1" class="v">1</span>Behold, bless ye the <span class="nd">LORD</span>, all <span class="add">ye</span> servants of the <span class="nd">LORD</span>, which by night stand in the house of the <span class="nd">LORD</span>.</p><p class="q1"><span data-number="2" data-sid="PSA 134:2" class="v">2</span>Lift up your hands <span class="add">in</span> the sanctuary, and bless the <span class="nd">LORD</span>.</p><p class="q1"><span data-number="3" data-sid="PSA 134:3" class="v">3</span>The <span class="nd">LORD</span> that made heaven and earth bless thee out of Zion.</p></body>
