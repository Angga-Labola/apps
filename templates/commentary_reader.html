<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Bible Commentary</title>
</head>
<body id="top" class="bible-app">
    <div id="navbar-placeholder"></div>
    <!-- The commentary reader script fills these regions and the chapter links. -->
    <main class="reader-main commentary-reader">
        <article class="reader-page">
            <div class="reader-page-top">
                <p class="reader-eyebrow">CHAPTER COMMENTARY</p>
                <span class="reader-page-flourish" aria-hidden="true">✦</span>
            </div>
            <h1 id="commentary-heading">Loading commentary...</h1>
            <p id="commentary-status" class="commentary-status" role="status" aria-live="polite">
                Loading commentary...
            </p>
            <div id="commentary-content" class="commentary-content"></div>
        </article>
        <nav class="commentary-navigation" aria-label="Commentary chapter navigation">
            <a id="previous-commentary" class="chapter-button chapter-button-secondary" aria-label="Previous chapter" aria-disabled="true" tabindex="-1">
                <span aria-hidden="true">←</span> Previous chapter
            </a>
            <a id="next-commentary" class="chapter-button" aria-label="Next chapter" aria-disabled="true" tabindex="-1">
                Next chapter <span aria-hidden="true">→</span>
            </a>
        </nav>
        <p id="commentary-navigation-status" class="commentary-navigation-status" role="status" aria-live="polite"></p>

    </main>
    <script src="/static/navbar-placeholder.js" defer></script>
    <script src="/static/commentary-reader.js" defer></script>
</body>
</html>
